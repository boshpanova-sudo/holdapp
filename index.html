<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hold App Pro</title>

<link rel="stylesheet" href="./css/style.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
</head>

<body>

<div class="bg"></div>

<div class="topbar">
    <div class="logo">HOLD</div>
    <div class="wallet-mini" id="wallet-mini">Not connected</div>
</div>

<div class="app">

<!-- PROFILE -->
<div class="page active" id="profile">

    <div class="card">

        <div class="avatar">👤</div>

        <div id="ton-connect-btn" class="connect-box"></div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="days-count">0</div>
                <div class="stat-label">Days streak</div>
            </div>

            <div class="stat">
                <div class="stat-value" id="token-count">0</div>
                <div class="stat-label">TON balance</div>
            </div>
        </div>

        <button class="checkin-btn" onclick="checkIn()">📅 Check in</button>
    </div>

    <!-- VIP -->
    <div class="card">
        <div class="card-title">🔥 VIP Levels</div>

        <div class="vip-grid">

            <div class="vip" onclick="enterVIP(1)">
                <div>Level 1</div>
                <div>100 TON</div>
            </div>

            <div class="vip" onclick="enterVIP(2)">
                <div>Level 2</div>
                <div>500 TON</div>
            </div>

            <div class="vip" onclick="enterVIP(3)">
                <div>Level 3</div>
                <div>1000 TON</div>
            </div>

        </div>
    </div>

</div>

<!-- RATING -->
<div class="page" id="rating">

    <div class="card">
        <div class="card-title">🏆 Leaderboard</div>

        <div id="leaderboard-list">
            Loading...
        </div>

        <button class="checkin-btn" onclick="loadLeaderboard()">
            🔄 Refresh
        </button>
    </div>

</div>

<!-- TAB 3 -->
<div class="page" id="tab3">
    <div class="card">Tab 3 (coming soon)</div>
</div>

<!-- TAB 4 -->
<div class="page" id="tab4">
    <div class="card">Tab 4 (coming soon)</div>
</div>

</div>

<!-- NAV -->
<div class="bottom-nav">

    <div class="nav-item active" onclick="openTab('profile', this)">👤</div>
    <div class="nav-item" onclick="openTab('rating', this)">🏆</div>
    <div class="nav-item" onclick="openTab('tab3', this)">⬜</div>
    <div class="nav-item" onclick="openTab('tab4', this)">⬜</div>

</div>

<script src="./js/app.js"></script>

</body>
</html>
